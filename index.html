<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Выживание среди их</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: Arial, sans-serif; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  
  #ui {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  
  #stats {
    position: absolute; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left));
    background: rgba(0,0,0,0.65); color: #eee; padding: 8px 12px;
    border-radius: 8px; font-size: 13px; line-height: 1.45;
    min-width: 140px; max-width: 42vw;
  }
  #stats .bar {
    height: 8px; background: #333; border-radius: 4px; margin-top: 3px; overflow: hidden;
  }
  #stats .bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
  #hunger-fill { background: #e67e22; }
  #thirst-fill { background: #3498db; }
  #energy-fill { background: #9b59b6; }
  #health-fill { background: #e74c3c; }
  
  #zone {
    position: absolute; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right));
    background: rgba(0,0,0,0.65); color: #fff; padding: 6px 14px;
    border-radius: 8px; font-size: 15px; font-weight: bold;
  }
  
  #message {
    position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); color: #fff; padding: 10px 18px;
    border-radius: 8px; font-size: 14px; max-width: 90%; text-align: center;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  #message.show { opacity: 1; }
  
  #controls-info {
    position: absolute; bottom: max(6px, env(safe-area-inset-bottom)); left: max(6px, env(safe-area-inset-left));
    background: rgba(0,0,0,0.55); color: #ccc; padding: 6px 10px;
    border-radius: 6px; font-size: 11px; line-height: 1.4;
  }
  
  /* Mobile joystick */
  #joystick-zone {
    position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); left: max(16px, env(safe-area-inset-left));
    width: 120px; height: 120px; pointer-events: auto;
  }
  #joystick-base {
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
    position: relative;
  }
  #joystick-knob {
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,255,255,0.5); position: absolute;
    top: 35px; left: 35px; touch-action: none;
  }
  
  #btn-look {
    position: absolute;
    bottom: max(72px, calc(env(safe-area-inset-bottom) + 62px));
    right: max(12px, env(safe-area-inset-right));
    width: 70px; height: 70px; border-radius: 50%;
    background: rgba(180,60,40,0.45); border: 2px solid rgba(220,80,50,0.7);
    color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center;
    pointer-events: auto; text-align: center; z-index: 45;
  }
  
  #btn-interact {
    position: absolute;
    bottom: max(148px, calc(env(safe-area-inset-bottom) + 138px));
    right: max(12px, env(safe-area-inset-right));
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(46, 204, 113, 0.45); border: 2px solid rgba(46, 204, 113, 0.75);
    color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center;
    pointer-events: auto; text-align: center; z-index: 45;
  }
  
  #btn-camera {
    position: absolute; top: calc(max(8px, env(safe-area-inset-top)) + 48px); right: max(8px, env(safe-area-inset-right));
    background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #555;
    padding: 6px 12px; border-radius: 6px; font-size: 12px;
    pointer-events: auto; z-index: 22;
  }
  
  #btn-sleep {
    position: absolute; top: calc(max(8px, env(safe-area-inset-top)) + 82px); right: max(8px, env(safe-area-inset-right));
    background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #555;
    padding: 6px 12px; border-radius: 6px; font-size: 12px;
    pointer-events: auto; z-index: 22;
  }

  @media screen and (orientation: landscape) and (max-width: 900px) {
    #stats { font-size: 11px; padding: 5px 8px; min-width: 120px; max-width: 28vw; }
    #stats .bar { height: 6px; }
    #zone { font-size: 13px; padding: 4px 10px; }
    #joystick-zone { width: 100px; height: 100px; bottom: max(12px, env(safe-area-inset-bottom)); left: max(12px, env(safe-area-inset-left)); }
    #joystick-base { width: 100px; height: 100px; }
    #joystick-knob { width: 42px; height: 42px; top: 29px; left: 29px; }
    #btn-look { width: 58px; height: 58px; font-size: 11px; }
    #btn-jump { width: 50px !important; height: 50px !important; font-size: 10px !important; }
    #btn-interact {
      width: 50px; height: 50px; font-size: 10px;
      bottom: max(14px, env(safe-area-inset-bottom));
      right: calc(max(12px, env(safe-area-inset-right)) + 124px);
    }
    #controls-info { display: none; }
    #message { bottom: 90px; font-size: 12px; }
    #btn-camera, #btn-sleep, #btn-menu, #btn-inv { font-size: 11px; padding: 4px 8px; }
  }

  #crosshair {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 6px; height: 6px; background: rgba(255,255,255,0.8);
    border-radius: 50%; pointer-events: none; display: none;
  }
  
  #start-screen {
    position: absolute; inset: 0; background: #0a0a0a;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    z-index: 100; color: #eee; text-align: center;
    padding: 24px 20px 40px; overflow-y: auto; overflow-x: hidden;
  }
  #start-screen > h1 { margin-top: max(12px, 8vh); flex-shrink: 0; }
  #start-screen h1 { font-size: 28px; margin-bottom: 8px; color: #e74c3c; }
  #start-screen p { font-size: 14px; color: #aaa; max-width: 320px; line-height: 1.5; margin-bottom: 6px; }
  #start-btn {
    margin-top: 24px; padding: 14px 36px; font-size: 18px;
    background: #c0392b; color: #fff; border: none; border-radius: 8px;
    cursor: pointer; pointer-events: auto;
  }

  #screamer-overlay {
    position: fixed; inset: 0; display: none; z-index: 400;
    pointer-events: auto; align-items: center; justify-content: center;
    flex-direction: column; overflow: hidden; padding: 16px; box-sizing: border-box;
  }
  #screamer-overlay.show { display: flex; }
  #screamer-face {
    font-size: min(36vmin, 200px); line-height: 1; max-height: 50vh;
    animation: scShake 0.07s linear infinite; filter: contrast(1.8) saturate(1.5);
    text-shadow: 0 0 12px #f00, 0 0 30px #f00;
  }
  @keyframes scShake {
    0% { transform: translate(-8px, 5px) rotate(-2deg); }
    50% { transform: translate(-10px, 4px) rotate(-3deg); }
    100% { transform: translate(5px, -3px) rotate(1deg); }
  }
  #screamer-text { margin-top: 10px; color: #f44; font-size: 22px; font-weight: bold; text-align: center; }
  #screamer-restart {
    margin-top: 14px; padding: 12px 26px; font-size: 16px;
    background: #8b0000; color: #fff; border: 2px solid #f44; border-radius: 10px; cursor: pointer;
  }

  #btn-menu {
    position: absolute; top: calc(max(8px, env(safe-area-inset-top)) + 116px); right: max(8px, env(safe-area-inset-right));
    background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #555;
    padding: 6px 12px; border-radius: 6px; font-size: 12px; pointer-events: auto; z-index: 22;
  }
  #btn-jump {
    position: absolute; bottom: max(72px, calc(env(safe-area-inset-bottom) + 62px));
    right: calc(max(12px, env(safe-area-inset-right)) + 78px);
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(50,120,200,0.4); border: 2px solid rgba(80,150,220,0.7);
    color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center;
    pointer-events: auto; text-align: center; z-index: 45;
  }

  #menu-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.85);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 200; pointer-events: auto; color: #eee; padding: 20px;
  }
  #menu-overlay.show { display: flex; }

  #menu-box {
    background: #1a1a1a; border: 1px solid #444; border-radius: 12px;
    padding: 20px; width: 90%; max-width: 340px; max-height: 90vh; overflow-y: auto;
  }
  #menu-box h2 { text-align: center; margin-bottom: 16px; color: #e74c3c; font-size: 20px; }
  
  .menu-btn {
    display: block; width: 100%; padding: 12px; margin: 6px 0;
    background: #333; color: #fff; border: 1px solid #555; border-radius: 8px;
    font-size: 15px; cursor: pointer; text-align: center;
  }

  #btn-inv {
    position: absolute; top: calc(max(8px, env(safe-area-inset-top)) + 150px); right: max(8px, env(safe-area-inset-right));
    background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #555;
    padding: 6px 12px; border-radius: 6px; font-size: 12px; pointer-events: auto; z-index: 22;
  }
  #inv-panel {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 92%; max-width: 360px; max-height: 80vh;
    background: rgba(15,15,15,0.95); border: 1px solid #555;
    border-radius: 12px; padding: 14px; display: none;
    pointer-events: auto; z-index: 150; overflow-y: auto; color: #eee;
  }
  #inv-panel.show { display: block; }
  #inv-panel h3 { text-align: center; margin-bottom: 10px; color: #e67e22; }
  #inv-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; min-height: 40px; }
  .inv-item {
    background: #2a2a2a; border: 1px solid #444; border-radius: 8px;
    padding: 8px; width: calc(50% - 3px); font-size: 12px; cursor: pointer;
  }
  .craft-btn {
    display: block; width: 100%; padding: 10px; margin: 4px 0;
    background: #2a3a2a; border: 1px solid #3a5a3a; border-radius: 8px;
    color: #cfc; font-size: 13px; cursor: pointer; text-align: left;
  }

  #hotbar {
    position: absolute; left: 50%; bottom: max(8px, env(safe-area-inset-bottom));
    transform: translateX(-50%); display: flex; gap: 3px; padding: 4px;
    background: rgba(0,0,0,0.55); border: 2px solid rgba(255,255,255,0.25);
    border-radius: 6px; z-index: 40; pointer-events: auto;
  }
  .hotbar-slot {
    width: 42px; height: 42px; background: rgba(30,30,30,0.85);
    border: 2px solid #555; border-radius: 4px; display: flex;
    align-items: center; justify-content: center; position: relative; cursor: pointer;
  }
  .hotbar-slot.selected { border-color: #fff; background: rgba(50,50,40,0.95); }
  .hotbar-slot .hb-icon { font-size: 18px; }
  
  #atmo-fx { position: fixed; inset: 0; pointer-events: none; z-index: 9;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 48%, rgba(4,10,18,0.55) 100%); }
</style>
</head>
<body>

<div id="start-screen">
  <div id="start-lang-row" style="display:flex;gap:8px;justify-content:center;margin:8px 0 4px;">
    <button type="button" id="start-lang-ru" style="padding:6px 14px;border-radius:8px;border:1px solid #555;background:#c0392b;color:#fff;cursor:pointer">RU</button>
    <button type="button" id="start-lang-en" style="padding:6px 14px;border-radius:8px;border:1px solid #555;background:#333;color:#fff;cursor:pointer">EN</button>
    <button type="button" id="start-lang-pl" style="padding:6px 14px;border-radius:8px;border:1px solid #555;background:#333;color:#fff;cursor:pointer">PL</button>
  </div>
  <h1 id="start-title">ВЫЖИВАНИЕ СРЕДИ ИХ</h1>
  <p id="start-desc1">Ты — бомж в районе Вавер (Варшава).</p>
  <p id="start-desc2">Микрорайоны: Anin, Wawer, Sadul, Międzylesie, Marysin Wawerski</p>
  <p id="start-desc3">Ищи еду в мусорках. Избегай SCP, диких животных и агрессивных бомжей.</p>
  <br>
  <button id="start-btn">ОДИН ИГРОК</button>
</div>

<div id="screamer-overlay">
  <div id="screamer-face">💀</div>
  <div id="screamer-text">ТЫ МЁРТВ</div>
  <button id="screamer-restart">Респавн</button>
</div>

<canvas id="game"></canvas>

<div id="ui">
  <div id="stats">
    <div>❤️ Здоровье</div>
    <div class="bar"><div id="health-fill" class="bar-fill" style="width:100%"></div></div>
    <div style="margin-top:6px">🍖 Голод</div>
    <div class="bar"><div id="hunger-fill" class="bar-fill" style="width:80%"></div></div>
    <div style="margin-top:6px">💧 Жажда</div>
    <div class="bar"><div id="thirst-fill" class="bar-fill" style="width:70%"></div></div>
    <div style="margin-top:6px">⚡ Энергия</div>
    <div class="bar"><div id="energy-fill" class="bar-fill" style="width:90%"></div></div>
  </div>
  
  <div id="zone">Anin</div>
  <div id="message"></div>
  <div id="crosshair"></div>
  
  <div id="joystick-zone">
    <div id="joystick-base">
      <div id="joystick-knob"></div>
    </div>
  </div>
  
  <div id="btn-look">УДАР</div>
  <div id="btn-interact">ВЗЯТЬ<br>E</div>
  <div id="btn-jump">ПРЫЖОК</div>
  <button id="btn-camera">1 / 2 / 3</button>
  <button id="btn-sleep">Спать</button>
  <button id="btn-menu">Меню</button>
  <button id="btn-inv">Инвентарь</button>

  <div id="hotbar"></div>
</div>

<div id="inv-panel">
  <h3 id="inv-title">Инвентарь</h3>
  <div id="inv-list"></div>
  <div id="craft-section">
    <h4 id="craft-title">Крафт</h4>
    <div id="craft-list"></div>
  </div>
  <button id="inv-close" class="menu-btn">Закрыть</button>
</div>

<div id="menu-overlay">
  <div id="menu-box">
    <h2 id="menu-title">Меню</h2>
    <button class="menu-btn" id="btn-resume">Продолжить</button>
    <button class="menu-btn" id="btn-restart">Начать заново</button>
    <button class="menu-btn" id="btn-close-menu">Закрыть</button>
  </div>
</div>

<div id="atmo-fx"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ==================== ДВИЖОК ИГРЫ И ВСЕ КЛАССЫ ====================
window.onerror = function(msg, url, line) {
  console.error('Err: ' + msg + ' (Line ' + line + ')');
  return false;
};

if (typeof THREE === 'undefined') {
  document.getElementById('start-screen').innerHTML = '<h1 style="color:red">Ошибка Three.js</h1>';
  throw new Error('THREE not loaded');
}

const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2030);
scene.fog = new THREE.Fog(0x1a2030, 20, 90);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

// Освещение
const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffeedd, 0.8);
sun.position.set(50, 100, 50);
sun.castShadow = true;
scene.add(sun);

// Земля
const groundGeo = new THREE.PlaneGeometry(500, 500);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x2e4d2e });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Игрок
const player = {
  x: 0, y: 1.6, z: 0,
  rotY: 0, rotX: 0,
  speed: 0.12,
  health: 100, hunger: 80, thirst: 70, energy: 90,
  inv: { food: 2, water: 1 },
  camMode: 1
};

const SKIN_CATALOG = [
  { id: 'default', name: 'Бомж', colors: { skin: 0xd4a882, coat: 0x2f6b3a, pants: 0x3a4550 } },
  { id: 'cyber', name: 'Кибер', colors: { skin: 0x88ffff, coat: 0x110033, pants: 0x001122 } }
];

let gameStarted = false;

function showMessage(msg) {
  const m = document.getElementById('message');
  if (!m) return;
  m.textContent = msg;
  m.classList.add('show');
  setTimeout(() => m.classList.remove('show'), 3000);
}

function updateStats() {
  document.getElementById('health-fill').style.width = player.health + '%';
  document.getElementById('hunger-fill').style.width = player.hunger + '%';
  document.getElementById('thirst-fill').style.width = player.thirst + '%';
  document.getElementById('energy-fill').style.width = player.energy + '%';
}

// Инициализация интерфейса
document.getElementById('start-btn').onclick = function() {
  document.getElementById('start-screen').style.display = 'none';
  gameStarted = true;
  showMessage('Добро пожаловать в Вавер! Выживай.');
};

document.getElementById('btn-inv').onclick = function() {
  const panel = document.getElementById('inv-panel');
  panel.classList.toggle('show');
};

document.getElementById('inv-close').onclick = function() {
  document.getElementById('inv-panel').classList.remove('show');
};

document.getElementById('btn-menu').onclick = function() {
  document.getElementById('menu-overlay').classList.add('show');
};

document.getElementById('btn-close-menu').onclick = function() {
  document.getElementById('menu-overlay').classList.remove('show');
};

document.getElementById('btn-resume').onclick = function() {
  document.getElementById('menu-overlay').classList.remove('show');
};

document.getElementById('btn-restart').onclick = function() {
  location.reload();
};

document.getElementById('screamer-restart').onclick = function() {
  document.getElementById('screamer-overlay').classList.remove('show');
  player.health = 100;
  player.hunger = 80;
  player.thirst = 70;
  player.energy = 90;
  updateStats();
};

// Главный игровой цикл
function animate() {
  requestAnimationFrame(animate);

  if (gameStarted) {
    // Падение голода / жажды
    player.hunger = Math.max(0, player.hunger - 0.002);
    player.thirst = Math.max(0, player.thirst - 0.003);
    if (player.hunger <= 0 || player.thirst <= 0) {
      player.health = Math.max(0, player.health - 0.05);
      if (player.health <= 0) {
        document.getElementById('screamer-overlay').classList.add('show');
      }
    }
    updateStats();

    // Камера
    camera.position.set(player.x, player.y, player.z);
    camera.rotation.y = player.rotY;
  }

  renderer.render(scene, camera);
}

window.onresize = function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
};

animate();
</script>
</body>
</html>
